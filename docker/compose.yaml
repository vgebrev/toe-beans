# Local services (architecture §8.1, backlog S0.5). Run through `pnpm compose …` from the repo root:
#   pnpm compose up -d --wait           MongoDB, the mock OIDC provider and SeaweedFS for `pnpm dev`
#   pnpm compose --profile app up --build -d --wait    the app image too, on http://localhost:3000
# Settings (MONGO_PORT, APP_PORT, LOG_LEVEL) come from the repo root's .env when there is one
# (see .env.example); `pnpm compose` passes it. Keep MONGODB_URI's port in step with MONGO_PORT.
name: toe-beans

services:
  mongo:
    # Atlas Local: the major version Atlas runs, already a single-node replica set, so
    # transactions work. The integration tests use the same image.
    image: mongodb/mongodb-atlas-local:8.0
    ports:
      - '127.0.0.1:${MONGO_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: ['CMD', '/usr/local/bin/runner', 'healthcheck']
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  mock-oidc:
    # A stand-in OIDC provider for offline dev and the e2e tests (architecture §3.4): its sign-in
    # form takes any subject and claims JSON, e.g. {"email": "sam@example.com",
    # "email_verified": true, "name": "Sam"}. The app uses it unless OIDC_ISSUER is set. Its issuer
    # follows the Host header, so it must stay on localhost:8090. Pinned by digest (D15); keep in
    # step with packages/backend/test/mock-oidc.ts and .github/workflows/ci.yml.
    image: ghcr.io/navikt/mock-oauth2-server:6.1.3@sha256:2a813381bf282da46ff36ff386059e7903e25865056af8149f4fb3f1441916b8
    environment:
      JSON_CONFIG: '{"interactiveLogin": true}'
    ports:
      - '127.0.0.1:8090:8080'

  seaweedfs:
    # The local S3-compatible photo store (architecture §3.6), standing in for R2: `weed mini` runs
    # every part in one process and makes the bucket at start. The credentials are sample values
    # for this container only. `pnpm dev` keeps photos in a directory unless PHOTO_STORE=s3
    # (.env.example). Pinned by digest (D15); keep in step with packages/backend/test/seaweedfs.ts.
    image: chrislusf/seaweedfs:4.51@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
    command: ['mini', '-dir=/data', '-bucket=toe-beans-photos', '-webdav=false', '-admin.ui=false']
    environment:
      AWS_ACCESS_KEY_ID: toe-beans-local
      AWS_SECRET_ACCESS_KEY: toe-beans-local-secret
    ports:
      - '127.0.0.1:${S3_PORT:-8333}:8333'
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8333/healthz']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  app:
    profiles: [app]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongo:27017/?directConnection=true
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Sign-in needs a provider the container can reach under the same issuer the browser sees,
      # so the app image uses the Auth0 dev tenant (OIDC_* from .env), not the mock.
      PUBLIC_BASE_URL: http://localhost:${APP_PORT:-3000}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      PHOTO_STORE: s3
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: toe-beans-photos
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: toe-beans-local
      S3_SECRET_ACCESS_KEY: toe-beans-local-secret
      # Reminders (architecture §6): the pair from .env, or one for this run. The container ticks
      # itself every TICK_INTERVAL_MINUTES.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:8080'
    depends_on:
      mongo:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      # No curl in the slim image; Node's fetch does the job.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  mongo-data:
  mongo-config:
  seaweedfs-data:
