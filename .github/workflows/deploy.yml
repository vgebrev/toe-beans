# Deploy to Cloud Run (architecture §8, D15; backlog S14.1). Runs on pushes to main, which only
# move by pull request after CI passes, and by hand. The job runs in the `production` environment
# (main only, owner approval), the one place with `id-token: write`. It gets GCP credentials by
# Workload Identity Federation, pinned to this repo's ID, that environment and main
# (infra/gcp/provision.sh). This environment holds no secrets: the runtime secrets stay in Secret
# Manager, in one secret (app-secrets), and Cloud Run mounts it.
#
# Non-secret settings come from the production environment's variables:
#   OIDC_CLIENT_ID     the prod Auth0 application's client ID
#   AUTH0_MANAGEMENT_CLIENT_ID  the prod account-deletion application's client ID (auth0.md §8)
#   R2_ACCOUNT_ID      the Cloudflare account ID, for the R2 endpoint
#   R2_ACCESS_KEY_ID   the R2 token's access key ID (its secret is in Secret Manager)
#   SENTRY_DSN         optional; unset turns error reports off
#
# Releases (architecture D40): the release is the version in package.json, which CI holds above
# every tag for a PR into main. The deploy refuses a version already tagged on another commit.
# Once prod is ready, the release job tags vX.Y.Z and publishes the GitHub Release from that
# version's CHANGELOG.md section, marked a pre-release for a candidate (-rc.N). Running it again
# on the same commit redeploys the same release.
#
# Third-party actions are pinned to commit SHAs (the tag is in the comment).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  # A deploy in flight finishes; the next one waits.
  cancel-in-progress: false

env:
  PROJECT: toe-beans-co-za
  REGION: africa-south1
  SERVICE: toe-beans
  IMAGE: africa-south1-docker.pkg.dev/toe-beans-co-za/toe-beans/app

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://toebeans.co.za
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.release.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tags, to check the version isn't taken.
          fetch-depth: 0

      # Node 24 runs the release tool's TypeScript directly; the runner's default Node is older.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Before anything is built or deployed.
      - name: Release name
        id: release
        run: |
          set -euo pipefail
          version=$(node tools/release/src/release.ts current)
          node tools/release/src/release.ts check
          tagged=$(git rev-parse --quiet --verify "refs/tags/v$version^{commit}" || true)
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::v$version is already released from ${tagged::12}: run pnpm release on develop and merge again"
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/1047834821273/locations/global/workloadIdentityPools/github/providers/toe-beans-github
          service_account: toe-beans-deploy@toe-beans-co-za.iam.gserviceaccount.com

      - name: Sign Docker in to Artifact Registry
        run: gcloud auth configure-docker africa-south1-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          # Both are labels only: the deploy uses the digest.
          tags: |
            ${{ env.IMAGE }}:${{ steps.release.outputs.name }}
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: APP_RELEASE=${{ steps.release.outputs.name }}
          # main's own cache scope; PR builds never write to it.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Deployed by digest, never by tag (D15). --set-env-vars and --set-secrets replace the
      # service's whole set each time, so this step is the full record of prod's configuration.
      - name: Deploy to Cloud Run
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE: ${{ steps.release.outputs.name }}
          OIDC_CLIENT_ID: ${{ vars.OIDC_CLIENT_ID }}
          AUTH0_MANAGEMENT_CLIENT_ID: ${{ vars.AUTH0_MANAGEMENT_CLIENT_ID }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ vars.R2_ACCESS_KEY_ID }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
        run: |
          for name in OIDC_CLIENT_ID AUTH0_MANAGEMENT_CLIENT_ID R2_ACCOUNT_ID R2_ACCESS_KEY_ID; do
            [ -n "${!name}" ] || { echo "::error::Set $name in the production environment's variables"; exit 1; }
          done
          url="https://$SERVICE-1047834821273.$REGION.run.app"
          vars=(
            "APP_RELEASE=$RELEASE"
            "LOG_LEVEL=info"
            "PUBLIC_BASE_URL=https://toebeans.co.za"
            "OIDC_ISSUER=https://auth.toebeans.co.za/"
            "OIDC_CLIENT_ID=$OIDC_CLIENT_ID"
            # Deleting an account deletes its Auth0 users through the tenant's own domain (D38).
            "AUTH0_DOMAIN=toe-beans.eu.auth0.com"
            "AUTH0_MANAGEMENT_CLIENT_ID=$AUTH0_MANAGEMENT_CLIENT_ID"
            "MONGODB_DB=toe-beans"
            "S3_ENDPOINT=https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
            "S3_BUCKET=toe-beans-photos"
            "S3_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID"
            "TICK_AUDIENCE=$url"
            "TICK_INVOKER=toe-beans-tick@$PROJECT.iam.gserviceaccount.com"
            # The Worker puts the phone's address (CF-Connecting-IP) here; requests without the
            # Worker's header secret are refused, so it can't be forged (architecture §7, D32).
            "ADDRESS_HEADER=x-toe-beans-client"
          )
          [ -z "$SENTRY_DSN" ] || vars+=("SENTRY_DSN=$SENTRY_DSN")
          # Every secret is in one, a JSON object the app spreads into its variables, so Secret
          # Manager bills one version, not one per value (architecture D45, infra/gcp/app-secrets.sh).
          secrets=("APP_SECRETS=app-secrets:latest")
          # Values can hold commas (none do today); ^|^ makes | the list separator instead.
          gcloud run deploy "$SERVICE" --project "$PROJECT" --region "$REGION" --quiet \
            --image "$IMAGE@$DIGEST" \
            --set-env-vars "^|^$(IFS='|'; echo "${vars[*]}")" \
            --set-secrets "$(IFS=','; echo "${secrets[*]}")"

      # Through the Worker, as phones reach it: only Cloud Run's invokers get to run.app directly
      # (architecture D45), and this checks the Worker's way in too.
      - name: Check it's ready
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors https://toebeans.co.za/readyz

  # Tags and publishes the release once prod runs it. contents: write only here, in a job with no
  # cloud credentials. Tags made with this token start no workflows.
  release:
    name: Tag and publish the release
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.deploy.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION is already published: this was a redeploy"
            exit 0
          fi
          node tools/release/src/release.ts notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          # A candidate is a pre-release, so the latest release stays the last final one.
          if [[ "$VERSION" == *-rc.* ]]; then kind=--prerelease; else kind=--latest; fi
          # --generate-notes adds the pull requests and a compare link after the changelog's notes.
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes "$kind"
